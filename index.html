<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1714">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>STRETCH</title>
<style>
:root{
  --ground:#1A1714; --panel:#221E1A; --panel2:#2A251F; --line:#37302A;
  --ink:#F2EDE4; --mut:#9C9189; --dim:#6E655E;
  --amber:#E0A03C; --amber-d:#8A6320; --green:#7FA37A;
  --runout:#D8442F;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ground);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{padding:0 0 env(safe-area-inset-bottom)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* ---------- top bar ---------- */
.top{display:flex;align-items:baseline;gap:14px;padding:18px 0 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{font-family:var(--mono);font-size:15px;letter-spacing:.34em;font-weight:600}
.top .stamp{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.08em}
.tbtn{background:none;border:1px solid var(--line);color:var(--mut);font-family:var(--mono);font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;padding:5px 9px;border-radius:2px;cursor:pointer}
.tbtn:hover{color:var(--ink);border-color:var(--dim)}

/* ---------- setup ---------- */
.setup{max-width:560px;margin:0 auto;padding:56px 20px}
.setup h1{font-family:var(--mono);font-size:20px;letter-spacing:.3em;font-weight:600;margin-bottom:22px}
.setup p{color:var(--mut);font-size:14px;line-height:1.6;margin-bottom:14px}
.setup ol{color:var(--mut);font-size:14px;line-height:1.7;margin:0 0 18px 18px}
input[type=text],input[type=number]{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);
  font-family:var(--mono);font-size:14px;padding:12px;border-radius:2px}
input[type=text]:focus,input[type=number]:focus{border-color:var(--amber);outline:none}
.btn{background:var(--amber);color:#191510;border:none;font-family:var(--mono);font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;font-weight:600;padding:12px 18px;border-radius:2px;cursor:pointer;margin-top:12px}
.btn:hover{background:#EDAE4A}

/* ---------- panels ---------- */
.grid{display:grid;gap:14px;margin:16px 0}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:1.25fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:16px}
.card h2{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
  font-weight:500;margin-bottom:12px}

function rawBox(){
  var c=el("div","card");
  c.appendChild(el("h2","","Raw data received (first 8 rows per tab)"));
  var pre=document.createElement("pre");
  pre.style.cssText="font-family:var(--mono);font-size:10px;color:var(--mut);white-space:pre-wrap;line-height:1.5;margin:0";
  var out="";
  TABS.forEach(function(t){
    out+="== "+t+" ==\n";
    (ST.tabs[t]||[]).slice(0,8).forEach(function(r,i){ out+=i+": "+JSON.stringify(r)+"\n"; });
    out+="\n";
  });
  pre.textContent=out; c.appendChild(pre); return c;
}

/* ---------- headline ---------- */
.headline{padding:22px 0 6px}
.hl-date{font-family:var(--mono);font-size:clamp(38px,7vw,62px);line-height:1;letter-spacing:-.02em;font-weight:600}
.hl-sub{margin-top:10px;font-size:14px;color:var(--mut)}
.short{color:var(--runout);font-weight:600}
.past{color:var(--green);font-weight:600}
.hl-meta{display:flex;gap:26px;flex-wrap:wrap;margin-top:14px}
.hl-meta div{min-width:96px}
.hl-meta .v{font-family:var(--mono);font-size:19px;margin-top:3px}

/* ---------- strip board (signature) ---------- */
.board{margin:6px 0 4px}
.strip{position:relative;height:52px;background:var(--panel);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.band{position:absolute;top:0;bottom:0;border-right:1px solid var(--line)}
.band span{position:absolute;bottom:4px;left:5px;font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--dim)}
.fill-live{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(180deg,rgba(224,160,60,.30),rgba(224,160,60,.13))}
.fill-proj{position:absolute;top:0;bottom:0;background:rgba(224,160,60,.07)}
.cut{position:absolute;top:0;bottom:0;width:2px;background:var(--runout)}
.cut::after{content:"";position:absolute;top:0;left:2px;right:-999px;bottom:0;background:repeating-linear-gradient(
  -45deg,transparent 0 5px,rgba(216,68,47,.10) 5px 10px)}
.mark{position:absolute;top:0;bottom:0;width:1px;background:var(--ink);opacity:.45}
.today{position:absolute;top:0;bottom:0;width:1px;background:var(--amber)}
.board-legend{display:flex;gap:16px;margin-top:7px}
.board-legend span{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}

/* ---------- lists ---------- */
.row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.row:last-child{border-bottom:none}
.row .lab{color:var(--ink)}
.row .when{color:var(--dim);font-family:var(--mono);font-size:11px;margin-left:8px}
.row .amt{font-family:var(--mono);font-variant-numeric:tabular-nums}
.amt.in{color:var(--green)}
.empty{color:var(--dim);font-size:13px;font-style:italic;padding:6px 0}

/* ---------- to spend ---------- */
.spend{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:12px}
.spend .v{font-family:var(--mono);font-size:27px;margin-top:3px}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.cal-head .m{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
.cal-nav{background:none;border:1px solid var(--line);color:var(--mut);width:24px;height:24px;border-radius:2px;
  cursor:pointer;font-family:var(--mono);font-size:12px;line-height:1}
.cal-nav:hover{color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dow{font-family:var(--mono);font-size:9px;color:var(--dim);text-align:center;padding:3px 0;letter-spacing:.1em}
.day{position:relative;aspect-ratio:1;background:var(--panel2);border:1px solid transparent;border-radius:2px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;min-height:34px}
.day.void{background:transparent;cursor:default}
.day .d{font-family:var(--mono);font-size:11px;color:var(--mut)}
.day.on .d{color:var(--ink)}
.day.after{opacity:.32}
.day.today{border-color:var(--amber)}
.day.ro{background:rgba(216,68,47,.20);border-color:var(--runout)}
.day.ro .d{color:var(--ink);font-weight:600}
.day.wrap{border-color:var(--ink)}
.day.sel{border-color:var(--amber);background:var(--panel)}
.dots{display:flex;gap:2px;height:4px;margin-top:2px}
.dot{width:3px;height:3px;border-radius:50%}
.dot.c{background:var(--amber)}
.dot.i{background:var(--green)}
.daydetail{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);font-size:13px}

/* ---------- what-if ---------- */
.badge{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ground);background:var(--amber);padding:2px 7px;border-radius:2px;font-weight:700}
.scenario{border-color:var(--amber)!important;
  background:linear-gradient(var(--panel),var(--panel)) padding-box,repeating-linear-gradient(
  -45deg,rgba(224,160,60,.05) 0 8px,transparent 8px 16px) border-box}
.slider{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px}
.slider label{flex:1;color:var(--mut)}
.slider input[type=range]{flex:1.4;accent-color:var(--amber);background:transparent}
.slider .rv{font-family:var(--mono);font-size:12px;width:78px;text-align:right}

/* ---------- warnings ---------- */
.warn{background:rgba(224,160,60,.07);border:1px solid var(--amber-d);border-radius:3px;padding:12px 14px;margin:14px 0}
.warn h3{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);margin-bottom:7px}
.warn ul{margin-left:16px;font-size:12.5px;color:var(--mut);line-height:1.65}
.err{border-color:var(--runout);background:rgba(216,68,47,.07)}
.err h3{color:var(--runout)}

/* ---------- purchase test ---------- */
.pt input{font-size:30px;text-align:center;padding:16px;letter-spacing:.02em}
.pt-out{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.pt-cost{display:flex;align-items:baseline;gap:12px}
.pt-days{font-family:var(--mono);font-size:56px;line-height:1;font-weight:600;color:var(--runout)}
.pt-days.zero{color:var(--mut)}
.pt-lab{font-size:13px;color:var(--mut);line-height:1.35}
.pt-shift{font-family:var(--mono);font-size:14px;color:var(--mut);margin-top:9px}
.pt-shift b{color:var(--ink);font-weight:500}
.pt-tight{margin-top:13px;padding-top:11px;border-top:1px dashed var(--line);font-size:13px;color:var(--mut)}
.pt-tight .rate{font-family:var(--mono);font-size:17px;color:var(--ink);display:block;margin-top:5px}

/* ---------- pocket ---------- */
.pocket{padding-bottom:34px}
.status{padding:16px 0 6px}
.st-big{font-family:var(--mono);font-size:clamp(34px,11vw,50px);line-height:1;font-weight:600;letter-spacing:-.02em}
.st-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
.st-row:last-child{border-bottom:none}
.st-row .v{font-family:var(--mono);font-size:19px}
.st-row .l{font-size:12px;color:var(--mut);align-self:center}
details.cats{margin-top:8px}
details.cats summary{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--dim);cursor:pointer;padding:5px 0}
.foot{text-align:center;color:var(--dim);font-size:11px;font-family:var(--mono);padding:22px 0 8px;letter-spacing:.08em}

@media (max-width:900px){.g3,.g2{grid-template-columns:1fr}.wrap{padding:0 15px}}
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
/* ===================== constants ===================== */
var LS_URL="stretch.url", LS_CACHE="stretch.cache";
var TABS=["Settings","Monthly","One-offs","Categories","Film","Rebalance Log"];
var HORIZON_MONTHS=24;
var MS=86400000;

/* ===================== small utils ===================== */
function $(s,r){return (r||document).querySelector(s);}
function el(t,c,x){var e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e;}
function esc(s){return String(s).replace(/[&<>"']/g,function(m){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];});}
var USD=function(n){return (n<0?"-":"")+"$"+Math.abs(Math.round(n)).toLocaleString("en-US");};
var USD2=function(n){return "$"+(Math.round(n*100)/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});};
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function fdate(d){return d?d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}):"—";}
function fshort(d){return d?d.toLocaleDateString("en-US",{month:"short",day:"numeric"}):"—";}
function daysBetween(a,b){return Math.round((stripT(b)-stripT(a))/MS);}
function stripT(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function addDays(d,n){var x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x;}
function dim(y,m){return new Date(y,m+1,0).getDate();}
function today(){return stripT(new Date());}

function parseNum(v){
  if(v==null) return null;
  if(typeof v==="number") return v;
  var s=String(v).trim(); if(!s) return null;
  var neg=/^\(.*\)$/.test(s); if(neg) s=s.slice(1,-1);
  s=s.replace(/[$,\s\u00A0]/g,"");
  if(!s||!/^-?\d*\.?\d+$/.test(s)) return null;
  var n=parseFloat(s); if(isNaN(n)) return null;
  return neg?-n:n;
}
function parseDate(v){
  if(v==null) return null;
  if(v instanceof Date) return stripT(v);
  var s=String(v).trim(); if(!s) return null;
  var m=s.match(/^Date\((\d+),(\d+),(\d+)/);           // gviz native
  if(m) return new Date(+m[1],+m[2],+m[3]);
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);            // ISO
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);       // US
  if(m){var y=+m[3]; if(y<100)y+=2000; return new Date(y,+m[1]-1,+m[2]);}
  var d=new Date(s);
  return isNaN(d.getTime())?null:stripT(d);
}
function isExample(s){return /^\s*example\b/i.test(String(s||""));}

/* ===================== CSV ===================== */
function parseCSV(text){
  var rows=[],row=[],cur="",q=false,i=0;
  while(i<text.length){
    var c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i+=2;continue;} q=false;i++;continue;}
      cur+=c;i++;continue;
    }
    if(c==='"'){q=true;i++;continue;}
    if(c===","){row.push(cur);cur="";i++;continue;}
    if(c==="\r"){i++;continue;}
    if(c==="\n"){row.push(cur);rows.push(row);row=[];cur="";i++;continue;}
    cur+=c;i++;
  }
  row.push(cur); rows.push(row);
  return rows.filter(function(r){return r.some(function(c){return String(c).trim()!=="";});});
}

/* ===================== fetch ===================== */
function sheetId(url){
  var m=String(url).match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  if(m) return m[1];
  m=String(url).match(/[-\w]{25,}/);
  return m?m[0]:null;
}
function tabURL(id,tab){
  return "https://docs.google.com/spreadsheets/d/"+id+"/gviz/tq?tqx=out:csv&headers=0&sheet="+encodeURIComponent(tab);
}
function fetchAll(url){
  var id=sheetId(url);
  if(!id) return Promise.reject({tab:"—",msg:"That doesn't look like a Google Sheets link. It should contain /spreadsheets/d/\u2026"});
  if(location.protocol==="file:") return Promise.reject({tab:"\u2014",msg:"This page is open from a file on your Mac (file:///\u2026). Safari blocks pages opened that way from reading anything on the internet, so it can never reach Google from here \u2014 nothing is wrong with your sheet. Put the file on GitHub Pages and open it at its https:// address."});
  if(/[?&]rtpof=true/.test(url)) return Promise.reject({tab:"\u2014",msg:"That link points to an uploaded Excel file, not a native Google Sheet. Google will only serve data from a native Sheet. Open it and choose File \u2192 Save as Google Sheets \u2014 that makes a new copy. Share the copy, then paste its link here."});
  return Promise.all(TABS.map(function(t){
    return fetch(tabURL(id,t),{cache:"no-store"}).then(function(r){
      if(!r.ok) throw {tab:t,msg:"Google returned "+r.status+" for the “"+t+"” tab. Check the tab name and that the sheet is shared as “anyone with the link can view.”"};
      return r.text();
    }).then(function(txt){
      if(/^\s*</.test(txt)) throw {tab:t,msg:"Google returned a sign-in page instead of data for the \u201c"+t+"\u201d tab. Either the sheet isn\u2019t shared as \u201canyone with the link can view,\u201d or it\u2019s an uploaded Excel file rather than a native Google Sheet."};
      return [t,parseCSV(txt)];
    });
  })).then(function(pairs){
    var o={}; pairs.forEach(function(p){o[p[0]]=p[1];}); return o;
  });
}

/* ===================== table helpers ===================== */
function findHeader(rows,names,tab){
  var h=findHeaderStrict(rows,names);
  if(h) return h;
  if(tab&&POS[tab]){
    var first=0;
    for(var r=0;r<Math.min(rows.length,10);r++){
      var low=rows[r].map(function(c){return String(c).trim().toLowerCase();});
      if(names.some(function(n){return low.indexOf(n)>=0;})){ first=r; break; }
    }
    return {row:first,map:POS[tab],fallback:true};
  }
  return null;
}
function findHeaderStrict(rows,names){
  for(var r=0;r<Math.min(rows.length,12);r++){
    var low=rows[r].map(function(c){return String(c).trim().toLowerCase();});
    var map={},hit=0;
    names.forEach(function(n){
      var i=low.findIndex(function(c){return c===n||c.indexOf(n)===0;});
      if(i>=0){map[n]=i;hit++;}
    });
    if(hit>=Math.min(2,names.length)) return {row:r,map:map};
  }
  return null;
}
function labelValue(rows,labels,kind){
  var want = kind==="date" ? parseDate : parseNum;
  for(var r=0;r<rows.length;r++){
    var a=String(rows[r][0]||"").trim().toLowerCase();
    for(var i=0;i<labels.length;i++){
      if(a.indexOf(labels[i])!==0) continue;
      for(var c=1;c<Math.min(rows[r].length,8);c++){
        var v=rows[r][c];
        if(v==null||String(v).trim()==="") continue;
        var got=want(v);
        if(got!=null) return got;
      }
      return null;
    }
  }
  return null;
}
var POS={
  "Monthly":{name:0,amount:1,"day of month":2,from:3,until:4},
  "One-offs":{date:0,name:1,amount:2,type:3},
  "Categories":{name:0,amount:1,period:2},
  "Rebalance Log":{date:0,"actual balance":1,note:2}
};
function isExampleRow(row){
  for(var i=0;i<row.length;i++){ if(/^\s*example\b/i.test(String(row[i]||""))) return true; }
  return false;
}

/* ===================== model ===================== */
function buildModel(tabs){
  var W=[],M={warnings:W};

  // -- Settings --
  var S=tabs["Settings"]||[];
  M.pot=labelValue(S,["total pot"],"num");
  M.start=labelValue(S,["start date"],"date");
  M.wrap=labelValue(S,["wrap date"],"date");
  if(M.pot==null) W.push("Settings: “Total pot” is empty or unreadable — using $0.");
  if(!M.start) W.push("Settings: “Start date” is empty or unreadable — using today.");
  if(!M.wrap) W.push("Settings: “Wrap date” is empty or unreadable.");
  if(M.pot==null)M.pot=0;
  if(!M.start)M.start=today();
  if(M.wrap&&M.wrap<=M.start){W.push("Settings: Wrap date is on or before Start date.");}

  // -- Film --
  var F=tabs["Film"]||[];
  M.film=labelValue(F,["envelope total","envelope"],"num");
  if(M.film==null){M.film=0;}

  // -- Monthly --
  M.monthly=[];
  var mt=tabs["Monthly"]||[], mh=findHeader(mt,["name","amount","day of month","from","until"],"Monthly");
  if(!mh){ W.push("Monthly: couldn't find the header row (Name / Amount / Day of month)."); }
  else{
    for(var r=mh.row+1;r<mt.length;r++){
      var rw=mt[r], name=String(rw[mh.map["name"]]||"").trim();
      var amt=parseNum(rw[mh.map["amount"]]);
      var dom=parseNum(rw[mh.map["day of month"]]);
      if(!name&&amt==null) continue;
      if(isExampleRow(rw)) continue;
      if(amt==null||amt===0) continue;
      if(dom==null||dom<1||dom>31){
        W.push("Monthly row "+(r+1)+": “"+(name||"unnamed")+"” is "+USD(amt)+" but has no valid day-of-month, so it never charges. Add a day 1–31.");
        continue;
      }
      M.monthly.push({name:name||"(unnamed)",amt:amt,dom:Math.round(dom),
        from:parseDate(rw[mh.map["from"]]),until:parseDate(rw[mh.map["until"]])});
      if(amt<0) W.push("Monthly row "+(r+1)+": “"+(name||"unnamed")+"” is negative ("+USD(amt)+"), so it's being treated as income. If that's the loan, it belongs in One-offs as type “income.”");
    }
  }

  // -- One-offs --
  M.oneoffs=[];
  var ot=tabs["One-offs"]||[], oh=findHeader(ot,["date","name","amount","type"],"One-offs");
  if(!oh){ W.push("One-offs: couldn't find the header row (Date / Name / Amount / Type)."); }
  else{
    for(var r2=oh.row+1;r2<ot.length;r2++){
      var rr=ot[r2], nm=String(rr[oh.map["name"]]||"").trim();
      var am=parseNum(rr[oh.map["amount"]]);
      var dt=parseDate(rr[oh.map["date"]]);
      if(!nm&&am==null) continue;
      if(isExampleRow(rr)) continue;
      if(am==null||am===0) continue;
      if(!dt){ W.push("One-offs row "+(r2+1)+": “"+(nm||"unnamed")+"” has no readable date, so it never applies."); continue; }
      var ty=String(rr[oh.map["type"]]||"").trim().toLowerCase();
      var income=(ty==="income");
      if(!ty) W.push("One-offs row "+(r2+1)+": “"+(nm||"unnamed")+"” has a blank Type, so it's counted as a cost.");
      M.oneoffs.push({name:nm||"(unnamed)",amt:Math.abs(am),income:income,date:dt});
    }
  }

  // -- Categories --
  M.cats=[];
  var ct=tabs["Categories"]||[], ch=findHeader(ct,["name","amount","period"],"Categories");
  if(!ch){ W.push("Categories: couldn't find the header row (Name / Amount / Period)."); }
  else{
    for(var r3=ch.row+1;r3<ct.length;r3++){
      var cr=ct[r3], cn=String(cr[ch.map["name"]]||"").trim();
      var ca=parseNum(cr[ch.map["amount"]]);
      var cp=String(cr[ch.map["period"]]||"").trim().toLowerCase();
      if(!cn&&ca==null) continue;
      if(isExampleRow(cr)) continue;
      if(ca==null||ca===0) continue;
      var per;
      if(cp.indexOf("day")===0)per=1; else if(cp.indexOf("week")===0)per=7; else if(cp.indexOf("month")===0)per=30.44;
      else{ W.push("Categories row "+(r3+1)+": “"+(cn||"unnamed")+"” has period “"+cp+"” — must be day, week, or month. Row ignored."); continue; }
      if(!cn) W.push("Categories row "+(r3+1)+": has an amount ("+USD(ca)+" / "+cp+") but no name. Add a name so it can be told apart.");
      M.cats.push({name:cn||"(unnamed row "+(r3+1)+")",amt:ca,period:cp,perDay:ca/per});
    }
  }
  M.flexDay=M.cats.reduce(function(s,c){return s+c.perDay;},0);

  // -- Rebalance --
  M.rebal=null; M.rebalAll=[];
  var rt=tabs["Rebalance Log"]||[], rh=findHeader(rt,["date","actual balance","note"],"Rebalance Log");
  if(rh){
    for(var r4=rh.row+1;r4<rt.length;r4++){
      var xr=rt[r4], nt=String(xr[rh.map["note"]]!=null?xr[rh.map["note"]]:"").trim();
      var bal=parseNum(xr[rh.map["actual balance"]]);
      var bd=parseDate(xr[rh.map["date"]]);
      if(bal==null&&!bd) continue;
      if(isExampleRow(xr)) continue;
      if(bal==null||!bd){
        if(bal!=null&&!bd) W.push("Rebalance Log row "+(r4+1)+": balance "+USD(bal)+" has no readable date — ignored.");
        continue;
      }
      M.rebalAll.push({date:bd,bal:bal,note:nt});
    }
    M.rebalAll.sort(function(a,b){return a.date-b.date;});
    var t0=today();
    for(var i2=0;i2<M.rebalAll.length;i2++){ if(M.rebalAll[i2].date<=t0) M.rebal=M.rebalAll[i2]; }
  }

  M.fixedDay=M.monthly.reduce(function(s,m){return s+m.amt;},0)/30.44;
  M.totalDays=M.wrap?daysBetween(M.start,M.wrap)+1:null;
  M.dayOf=daysBetween(M.start,today())+1;
  return M;
}

/* ===================== projection ===================== */
function project(M,opts){
  opts=opts||{};
  var scale=opts.scale||{};                // per-category multiplier (what-if)
  var extra=opts.extra||0;                 // one-time hit today (purchase test)
  var flexMul=opts.flexMul==null?1:opts.flexMul;

  var origin = M.rebal ? M.rebal.date : M.start;
  var amount = M.rebal ? M.rebal.bal : M.pot;
  var bal = amount - (M.film||0);

  // one-offs before origin fold into day 1
  M.oneoffs.forEach(function(o){
    if(o.date<origin) bal += o.income?o.amt:-o.amt;
  });

  var perDay=0;
  M.cats.forEach(function(c){ perDay += c.perDay*(scale[c.name]==null?1:scale[c.name]); });
  perDay *= flexMul;

  var end=addDays(origin,Math.round(HORIZON_MONTHS*30.44));
  var t0=today();
  var hitDay = t0<origin ? origin : t0;   // if the Stretch hasn't started, test against day 1
  var days=[],runout=null,wrapBal=null;
  var cur=new Date(origin.getTime());

  while(cur<=end){
    var items=[];
    var y=cur.getFullYear(),mo=cur.getMonth(),d=cur.getDate(),last=dim(y,mo);
    for(var i=0;i<M.monthly.length;i++){
      var m=M.monthly[i];
      var due=Math.min(m.dom,last);
      if(d!==due) continue;
      if(m.from&&cur<m.from) continue;
      if(m.until&&cur>m.until) continue;
      bal-=m.amt; items.push({name:m.name,amt:m.amt,income:m.amt<0});
    }
    for(var j=0;j<M.oneoffs.length;j++){
      var o=M.oneoffs[j];
      if(o.date<origin||o.date.getTime()!==cur.getTime()) continue;
      bal += o.income?o.amt:-o.amt;
      items.push({name:o.name,amt:o.income?-o.amt:o.amt,income:o.income});
    }
    if(extra&&cur.getTime()===hitDay.getTime()){ bal-=extra; items.push({name:"Purchase test",amt:extra,income:false}); }
    bal-=perDay;

    days.push({date:new Date(cur.getTime()),bal:bal,items:items});
    if(runout===null&&bal<0) runout=new Date(cur.getTime());
    if(M.wrap&&cur.getTime()===M.wrap.getTime()) wrapBal=bal;
    cur=addDays(cur,1);
  }
  if(M.wrap&&wrapBal===null&&M.wrap<origin) wrapBal=amount-(M.film||0);
  return {days:days,runout:runout,wrapBal:wrapBal,perDay:perDay,origin:origin};
}

/* solve: what flexible $/day still reaches Wrap, given a purchase */
function solveRate(M,extra){
  if(!M.wrap||M.flexDay<=0) return null;
  var lo=0,hi=1,best=null;
  for(var i=0;i<40;i++){
    var mid=(lo+hi)/2;
    var p=project(M,{extra:extra,flexMul:mid});
    if(p.wrapBal!=null&&p.wrapBal>=0){best=mid;lo=mid;} else hi=mid;
  }
  return best==null?0:best*M.flexDay;
}

  }

function load(){

    ST.tabs=tabs; ST.stamp=Date.now(); ST.fetchErr=null;

/* ---------- strip board ---------- */
function board(){
  var M=ST.M,P=ST.proj;
  if(!M.wrap) return null;
  var b=el("div","board");
  var strip=el("div","strip");
  var t0=today();
  var s=M.start, e=M.wrap;
  var span=Math.max(1,daysBetween(s,e));
  // extend the visual a little past wrap if run-out is later
  var endView=(P.runout&&P.runout>e)?P.runout:e;
  var vspan=Math.max(1,daysBetween(s,endView));
  function pct(d){ return Math.max(0,Math.min(100,(daysBetween(s,d)/vspan)*100)); }

  // month bands
  var cur=new Date(s.getFullYear(),s.getMonth(),1);
  while(cur<=endView){
    var mStart=cur<s?s:cur;
    var next=new Date(cur.getFullYear(),cur.getMonth()+1,1);
    var mEnd=next>endView?endView:next;
    var l=pct(mStart), r=pct(mEnd);
    var bd=el("div","band");
    bd.style.left=l+"%"; bd.style.width=Math.max(0,r-l)+"%";
    if(r-l>6) bd.appendChild(el("span","",cur.toLocaleDateString("en-US",{month:"short"}).toUpperCase()));
    strip.appendChild(bd);
    cur=next;
  }
  var live=el("div","fill-live"); live.style.width=pct(t0<s?s:t0)+"%"; strip.appendChild(live);
  var projEnd=P.runout?P.runout:endView;
  var pf=el("div","fill-proj");
  pf.style.left=pct(t0<s?s:t0)+"%"; pf.style.width=Math.max(0,pct(projEnd)-pct(t0<s?s:t0))+"%";
  strip.appendChild(pf);
  if(t0>=s&&t0<=endView){ var td=el("div","today"); td.style.left=pct(t0)+"%"; strip.appendChild(td); }
  var wm=el("div","mark"); wm.style.left=pct(e)+"%"; strip.appendChild(wm);
  if(P.runout&&P.runout<=endView){ var cu=el("div","cut"); cu.style.left=pct(P.runout)+"%"; strip.appendChild(cu); }
  b.appendChild(strip);
  var lg=el("div","board-legend");
  lg.appendChild(el("span","","Start "+fshort(s)));
  lg.appendChild(el("span","","Wrap "+fshort(e)));
  if(P.runout) lg.appendChild(el("span","","Run-out "+fshort(P.runout)));
  b.appendChild(lg);
  return b;
}

  inp.setAttribute("aria-label","Purchase amount");
  c.appendChild(inp);
  var out=el("div","pt-out"); c.appendChild(out);

  function draw(){
    out.innerHTML="";
    var v=parseFloat(ST.pt);
    if(!v||v<=0||isNaN(v)){
      out.appendChild(el("div","empty","Type an amount to see what it costs you in days."));
      return;
    }
    var after=project(M,{scale:ST.scale,extra:v});
    var base=P.runout, now=after.runout;
    var cost = (base&&now)?daysBetween(now,base):null;
    var cd=el("div","pt-cost");
    cd.appendChild(el("div","pt-days"+(cost===0?" zero":""), cost==null?"—":String(Math.abs(cost))));
    cd.appendChild(el("div","pt-lab", cost==null?"No run-out inside the horizon."
      : cost===0 ? "days — this doesn't move the run-out date, but the money is still gone"
      : (Math.abs(cost)===1?"day off your runway":"days off your runway")));
    out.appendChild(cd);
    if(base&&now&&cost!==0){
      var sh=el("div","pt-shift");
      sh.innerHTML="Run-out <b>"+esc(fshort(base))+"</b> → <b>"+esc(fshort(now))+"</b>";
      out.appendChild(sh);
    }
    if(P.wrapBal!=null&&after.wrapBal!=null){
      var wb=el("div","pt-shift");
      wb.innerHTML="Balance on Wrap <b>"+esc(USD(P.wrapBal))+"</b> → <b>"+esc(USD(after.wrapBal))+"</b>";
      out.appendChild(wb);
    }
    var t=el("div","pt-tight");
    if(!M.wrap){ t.textContent="Set a Wrap date in the sheet to see the tightening figure."; }
    else if(M.flexDay<=0){ t.textContent="No flexible categories, so there's nothing left to tighten — this comes straight off the run-out date."; }
    else{
      var need=solveRate(M,v);
      var cur=P.perDay;
      if(need==null){ t.textContent="—"; }
      else if(need>=cur-0.005){ t.innerHTML="Still reaches Wrap without tightening."; }
      else{
        t.innerHTML='<span class="badge">Scenario</span> To still hit Wrap after this:'+
          '<span class="rate">'+esc(USD2(cur))+'/day → '+esc(USD2(need))+'/day flexible</span>';
      }
    }
    out.appendChild(t);
  }
  inp.oninput=function(){ ST.pt=inp.value; draw(); };
  draw();
  return c;
}

/* ---------- desk ---------- */
function desk(w){
  var M=ST.M;
  w.appendChild(headline());
  var bd=board(); if(bd) w.appendChild(bd);
  var wb=warnBox(M); if(wb) w.appendChild(wb);
  var g1=el("div","grid g3");
  g1.appendChild(toSpend()); g1.appendChild(coming(14)); g1.appendChild(film());
  w.appendChild(g1);
  var g2=el("div","grid g2");
  g2.appendChild(calendar());
  var right=el("div");
  right.appendChild(whatIf());
  var sp=el("div"); sp.style.height="14px"; right.appendChild(sp);
  right.appendChild(purchaseTest());
  g2.appendChild(right);
  w.appendChild(g2);
}

/* ---------- pocket ---------- */
function pocket(w){
  var M=ST.M,P=ST.proj;
  var p=el("div","pocket");
  var st=el("div","status");
  st.appendChild(el("div","eyebrow","Projected run-out"));
  st.appendChild(el("div","st-big num", P.runout?fdate(P.runout):"Beyond horizon"));
  if(M.wrap&&P.runout){
    var diff=daysBetween(M.wrap,P.runout);
    var sub=el("div","hl-sub");
    sub.innerHTML=diff<0?'<span class="short">'+Math.abs(diff)+' days short of Wrap</span>'
                        :'<span class="past">'+diff+' days past Wrap</span>';
    st.appendChild(sub);
  }
  p.appendChild(st);

  var card=el("div","card");
  function sr(l,v,cls){ var r=el("div","st-row"); r.appendChild(el("div","l",l));
    r.appendChild(el("div","v num "+(cls||""),v)); card.appendChild(r); }
  sr("Day of Stretch", M.totalDays? "Day "+Math.max(0,M.dayOf)+" of "+M.totalDays : "—");
  sr("Spendable today", USD2(P.perDay));
  sr("Spendable this week", USD2(P.perDay*7));
  var amount=M.rebal?M.rebal.bal:M.pot;
  sr("Funds remaining", USD(amount-(M.film||0)));
  sr("Today", new Date().toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"}));
  if(M.cats.length){
    var det=el("details","cats");
    det.appendChild(el("summary",null,"Per category"));
    M.cats.forEach(function(k){
      var mul=ST.scale[k.name]==null?1:ST.scale[k.name];
      var r=el("div","row"); r.appendChild(el("div","lab",k.name));
      r.appendChild(el("div","amt",USD2(k.perDay*mul)+"/d")); det.appendChild(r);
    });
    card.appendChild(det);
  }
  p.appendChild(card);

  var sp=el("div"); sp.style.height="14px"; p.appendChild(sp);
  p.appendChild(purchaseTest());
  var sp2=el("div"); sp2.style.height="14px"; p.appendChild(sp2);
  p.appendChild(calendar());
  var sp3=el("div"); sp3.style.height="14px"; p.appendChild(sp3);
  p.appendChild(coming(14));
  var wb=warnBox(M); if(wb) p.appendChild(wb);
  w.appendChild(p);
}

window.addEventListener("resize",function(){
  var want=window.innerWidth<820?"pocket":"desk";
  if(!ST.manual&&ST.M&&want!==ST.mode){ ST.mode=want; render(); }
});
boot();
</script>
